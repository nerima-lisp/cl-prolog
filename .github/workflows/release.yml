name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Split from `release` on purpose, unlike workflow-templates/release.yml,
  # which runs `nix flake check` inside the job that holds contents: write.
  # `nix flake check` executes this repository's own code (flake.nix, t/*.lisp),
  # so it runs here with contents: read and nothing else; only the job that
  # publishes gets write access, and that job runs no repository code.
  verify:
    name: Verify flake checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Never publish a release that does not pass its own test suite.
      - name: Verify the tagged tree
        timeout-minutes: 25
        run: nix flake check --print-build-logs

  release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enforces the org invariant "git tag == .asd :version" at the only point
      # where it can still be corrected cheaply. Without this gate the two drift
      # silently, which is how cl-boundary-kit reached :version 1.0.0 while its
      # newest tag was still v0.6.0.
      #
      # The sed is anchored to the line start so a comment or docstring merely
      # mentioning :version cannot shadow the real field, and an empty result is
      # reported rather than silently compared against the tag.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-prolog
        run: |
          set -euo pipefail
          asd_version="$(sed -n 's/^[[:space:]]*:version[[:space:]]\+"\([^"]*\)".*/\1/p' "$PACKAGE.asd" | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$asd_version" ]]; then
            echo "::error::Could not read :version from $PACKAGE.asd" >&2
            exit 1
          fi
          echo "asd=$asd_version tag=$tag_version"
          if [[ "$asd_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE.asd version $asd_version" >&2
            exit 1
          fi

      # Extracts this version's CHANGELOG section as the release body. Requires
      # the Keep a Changelog heading format `## [X.Y.Z] - YYYY-MM-DD`.
      #
      # Written straight to a file rather than through GITHUB_ENV: a CHANGELOG
      # line can then never be read as an environment assignment.
      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [$version]" >&2
            exit 1
          fi

      # `gh` ships on the runner, so this needs no third-party action at all —
      # one fewer supplier to trust than the template's
      # softprops/action-gh-release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md
