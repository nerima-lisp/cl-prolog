name: Benchmarks

# Diagnostic only — never a merge gate. benchmarks/performance.lisp exists to
# measure and compare, not to pass or fail (see docs/src/reference/benchmarks.md).
# Manual dispatch plus a weekly schedule keep it off the PR path entirely, so
# runner-to-runner noise can never block a merge.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  performance:
    name: In-process micro-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run micro-benchmarks
        timeout-minutes: 15
        run: |
          timeout -k 30 900 nix develop --command \
            sbcl --script benchmarks/performance.lisp
